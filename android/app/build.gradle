plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
// The live site the app loads (CI sets this to this repo's GitHub Pages address).
// If empty, the app runs from the copy of /dashboard bundled inside it.
def startUrl = System.getenv('SKREEN_START_URL') ?: ''

android {
    namespace 'app.skreen'
    compileSdk 36

    defaultConfig {
        applicationId 'app.skreen.wall'
        minSdk 26
        versionCode runNumber
        versionName "1.0.${runNumber}"
        resValue 'string', 'start_url', startUrl
    }

    buildFeatures { buildConfig true }

    // Two builds of the same app:
    //   sideload: the APK on GitHub Releases, with the in-app updater.
    //   play:     the Android App Bundle for Google Play (no self-updater, no install permission).
    flavorDimensions 'dist'
    productFlavors {
        sideload {
            dimension 'dist'
            targetSdk 34
            buildConfigField 'boolean', 'PLAY', 'false'
        }
        play {
            dimension 'dist'
            targetSdk 36   // Google Play requires new apps to target Android 16 (API 36)
            buildConfigField 'boolean', 'PLAY', 'true'
        }
    }

    // A fixed key checked into the repo, so every build is signed the same way and
    // a new APK installs over the old one. Fine for a personal sideloaded app.
    signingConfigs {
        sideload {
            storeFile file('../skreen-sideload.jks')
            storePassword 'skreen-sideload'
            keyAlias 'skreen'
            keyPassword 'skreen-sideload'
        }
    }

    // Upload key for Google Play: private, supplied by CI from repository secrets (never committed).
    def uploadStore = System.getenv('UPLOAD_KEYSTORE_PATH')
    if (uploadStore) {
        signingConfigs {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
            }
        }
        productFlavors.play.signingConfig = signingConfigs.upload
    }
    productFlavors.sideload.signingConfig = signingConfigs.sideload

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // The web app in /dashboard is bundled into the APK as-is.
    sourceSets {
        main {
            assets.srcDirs = ['../../dashboard']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Keep every Kotlin standard-library artifact on one version (androidx.core and play-services-auth
    // otherwise pull in different ones, and the build refuses duplicates).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.android.billingclient:billing:7.1.1'
}
