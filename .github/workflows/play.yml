name: Build Play Store bundle

# Builds the Android App Bundle (.aab) to upload to the Google Play Console.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_B64       the upload keystore file, base64-encoded
#   UPLOAD_KEYSTORE_PASSWORD  its password
#   UPLOAD_KEY_ALIAS          the key alias
#   UPLOAD_KEY_PASSWORD       the key password
# Run it by hand: Actions → Build Play Store bundle → Run workflow.
# Download the result from the run's page (Artifacts → Skreen-play-aab).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode the upload key
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "Missing UPLOAD_KEYSTORE_B64 secret" >&2; exit 1; fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Point the app at the live site
        run: echo "SKREEN_START_URL=https://app.skreen.fyi/" >> "$GITHUB_ENV"

      - name: Build the signed bundle
        working-directory: android
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle bundlePlayRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Skreen-play-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
