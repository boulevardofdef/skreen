name: Build Android app

# Builds Skreen.apk from /android (which loads the live Pages site and bundles
# /dashboard as an offline fallback) and publishes it
# to the "latest" release, so https://github.com/<you>/<repo>/releases/latest/download/Skreen.apk
# always points at the newest build.

on:
  push:
    branches: [main]
    # The app loads the live site, so dashboard/ changes don't need a new APK.
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Point the app at this repo's GitHub Pages site
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "SKREEN_START_URL=https://${owner}.github.io/${repo}/" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Skreen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Skreen-apk
          path: Skreen.apk

      - name: Move the "latest" tag to this commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Skreen (latest build)
          body: |
            Sideload this onto your Android tablet. Built from commit ${{ github.sha }}.
            Download **Skreen.apk**, open it, and allow "install unknown apps" when asked.
          files: Skreen.apk
          make_latest: true
