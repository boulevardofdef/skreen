<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Arch;src:url(file:///home/user/skreen/dashboard/fonts/archivo.woff2);font-weight:100 900;font-stretch:62% 125%}
body{margin:0;background:transparent;display:flex;flex-direction:column;gap:60px;align-items:flex-start;padding:40px;width:max-content}
.word{display:flex;align-items:center}
.tab{border-radius:calc(var(--fs)*.2);background:#2a2723;box-shadow:inset 0 0 0 calc(var(--fs)*.03) #4a453e;display:flex;align-items:center;justify-content:flex-end;position:relative;box-sizing:border-box;flex:none}
.tab::before{content:"";position:absolute;inset:calc(var(--fs)*.104);border-radius:calc(var(--fs)*.125);background:#171513}
.sk,.rest{font-family:Arch;font-weight:800;font-stretch:100%;letter-spacing:-.03em;line-height:1;font-size:var(--fs);white-space:nowrap}
.sk{position:relative;color:#ff5b2e}
.rest{color:#0e0d0b}
.dk .rest{color:#f3eee3}
</style>
<div class="word" id="lock" style="--fs:300px"><div class="tab"><span class="sk">Sk</span></div><div class="rest">reen</div></div>
<div class="word dk" id="lockdk" style="--fs:300px"><div class="tab"><span class="sk">Sk</span></div><div class="rest">reen</div></div>
<div class="word" id="tabonly" style="--fs:300px"><div class="tab"><span class="sk">Sk</span></div></div>
<script>
document.fonts.ready.then(()=>{
 document.querySelectorAll('.word').forEach(w=>{
  const t=w.querySelector('.tab'), sk=t.querySelector('.sk'), fs=300, skw=sk.getBoundingClientRect().width;
  const bez=fs*.104, padL=fs*.34, padR=fs*.07;
  t.style.width=(skw+padL+padR+2*bez)+'px'; t.style.height=(fs*1.42)+'px'; t.style.paddingRight=(bez+padR)+'px';
 });
 document.body.dataset.ready=1;});
</script>
