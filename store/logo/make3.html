<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(file:///home/user/skreen/site/fonts/bricolage.woff2);font-weight:200 800}
body{margin:0;background:#0e0d0b} svg{display:block}
text{font-family:B,sans-serif;font-weight:800;font-stretch:80%}
</style>
<div id="root"></div>
<script>
const NS='http://www.w3.org/2000/svg';
const tangents=(A,C,r)=>{const dx=C.x-A.x,dy=C.y-A.y,d=Math.hypot(dx,dy),th=Math.atan2(dy,dx),al=Math.asin(r/d),L=Math.sqrt(d*d-r*r);
  return [-1,1].map(s=>({x:A.x+L*Math.cos(th+s*al),y:A.y+L*Math.sin(th+s*al)}));};
function build(o){ // o: W,H, screen{x,y,w,h}, bezel, apex, C, r, textSize, textX(fn), dimFill, id
  const {W,H,screen:s,bezel:b}=o, d={x:s.x+b,y:s.y+b,w:s.w-2*b,h:s.h-2*b};
  const [t1,t2]=tangents(o.apex,o.C,o.r);
  const svg=`<svg id="${o.id}" width="${o.W}" height="${o.H}" viewBox="0 0 ${o.W} ${o.H}" xmlns="${NS}">
  <defs>
   <clipPath id="disp${o.id}"><rect x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" rx="22"/></clipPath>
   <clipPath id="lit${o.id}"><circle cx="${o.C.x}" cy="${o.C.y}" r="${o.r}"/></clipPath>
   <linearGradient id="beam${o.id}" gradientUnits="userSpaceOnUse" x1="${o.apex.x}" y1="${o.apex.y}" x2="${o.C.x}" y2="${o.C.y}"><stop offset="0" stop-color="#ffb08a" stop-opacity=".08"/><stop offset="1" stop-color="#ffd7bd" stop-opacity=".5"/></linearGradient>
   <radialGradient id="pool${o.id}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".72" stop-color="#f3eee3"/><stop offset="1" stop-color="#e8c9a8"/></radialGradient>
   <radialGradient id="glow${o.id}" cx="50%" cy="50%" r="50%"><stop offset=".6" stop-color="#ff5b2e" stop-opacity=".4"/><stop offset="1" stop-color="#ff5b2e" stop-opacity="0"/></radialGradient>
   ${o.dimDefs||''}
  </defs>
  <rect width="${W}" height="${H}" fill="#0e0d0b"/>
  <!-- the screen: bezel, then the display -->
  <rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="36" fill="#2a2723" stroke="#44403a" stroke-width="3"/>
  <rect x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" rx="22" fill="#171513"/>
  <g clip-path="url(#disp${o.id})">
   <text id="dim${o.id}" y="${o.baseline}" font-size="${o.textSize}" fill="${o.dimFill}">Skreen</text>
   <polygon points="${o.apex.x},${o.apex.y} ${t1.x},${t1.y} ${t2.x},${t2.y}" fill="url(#beam${o.id})"/>
   <circle cx="${o.C.x}" cy="${o.C.y}" r="${o.r*1.5}" fill="url(#glow${o.id})"/>
   <circle cx="${o.C.x}" cy="${o.C.y}" r="${o.r}" fill="url(#pool${o.id})"/>
   <text id="lit${o.id}t" y="${o.baseline}" font-size="${o.textSize}" fill="#ff5b2e" clip-path="url(#lit${o.id})">Skreen</text>
  </g></svg>`;
  return svg;
}
const wide={id:'wide',W:1024,H:649,screen:{x:12,y:12,w:1000,h:625},bezel:22,stand:46,apex:{x:-30,y:-30},C:{x:252,y:326},r:204,textSize:300,baseline:445,dimFill:'#8a7f72'};
const sq={id:'sq',W:512,H:512,screen:{x:14,y:106,w:484,h:300},bezel:14,stand:30,apex:{x:-20,y:-20},C:{x:256,y:256},r:122,textSize:192,baseline:325,dimFill:'url(#fadesq)',
  dimDefs:'<linearGradient id="fadesq" gradientUnits="userSpaceOnUse" x1="368" y1="0" x2="500" y2="0"><stop offset="0" stop-color="#8a7f72" stop-opacity=".62"/><stop offset=".55" stop-color="#6a6156" stop-opacity=".22"/><stop offset="1" stop-color="#4a443c" stop-opacity=".03"/></linearGradient>'};
document.getElementById('root').innerHTML=build(wide)+build(sq);
document.fonts.ready.then(()=>{
  // wide: fit "Skreen" across the display; square: centre "Sk" on the spotlight
  const wd=document.getElementById('dimwide'), wl=document.getElementById('litwidet');
  let fs=300; [wd,wl].forEach(t=>t.setAttribute('font-size',fs)); const w=wd.getComputedTextLength(); fs=fs*870/w; [wd,wl].forEach(t=>{t.setAttribute('font-size',fs.toFixed(1));t.setAttribute('x','90')});
  const sd=document.getElementById('dimsq'), sl=document.getElementById('litsqt');
  const skw=sd.getSubStringLength(0,2); const x0=sq.C.x-skw/2; [sd,sl].forEach(t=>t.setAttribute('x',x0.toFixed(1)));
  document.body.dataset.ready='1';
});
</script>
