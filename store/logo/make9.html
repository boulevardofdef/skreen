<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Arch;src:url(file:///home/user/skreen/dashboard/fonts/archivo.woff2);font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Mono;src:url(file:///home/user/skreen/dashboard/fonts/geist-mono.woff2);font-weight:100 900}
body{margin:0;background:#f3eee3;font-family:Mono,monospace;width:1500px}
.grid{display:grid;grid-template-columns:1fr 1fr}
.cell{padding:30px 44px 28px;border:1px solid rgba(14,13,11,.12);margin:-1px 0 0 -1px;display:flex;flex-direction:column;gap:20px}
.cell.dk{background:#0e0d0b}
.lab{font:600 17px Mono;letter-spacing:.12em;color:#5d574c;text-transform:uppercase}
.dk .lab{color:#9a9184}
.row{display:flex;align-items:center;gap:44px}
.word{display:flex;align-items:center}
.tab{border-radius:calc(var(--fs)*.2);background:#2a2723;box-shadow:inset 0 0 0 calc(var(--fs)*.03) #4a453e;display:flex;align-items:center;justify-content:flex-end;position:relative;box-sizing:border-box;flex:none}
.tab::before{content:"";position:absolute;inset:calc(var(--fs)*.104);border-radius:calc(var(--fs)*.125);background:#171513}
.inner{position:relative;display:flex;align-items:center}
.sk,.rest{font-family:Arch;font-weight:800;font-stretch:100%;letter-spacing:-.03em;line-height:1;font-size:var(--fs);white-space:nowrap}
.sk{color:#ff5b2e}
.rest{color:#0e0d0b}.dk .rest{color:#f3eee3}
.tri{display:block;flex:none}
small{font:500 13px Mono;color:#8a8377;letter-spacing:.08em}
</style>
<div class="grid" id="g"></div>
<script>
const FS=96;
const bar=(c,h,w=.075)=>`<span style="display:block;flex:none;width:${FS*w}px;height:${FS*h}px;background:${c};border-radius:${FS*.04}px;margin-right:${FS*.06}px"></span>`;
const rules=bar('#5fbf8f',.5)+bar('#9aa5ff',.5)+bar('#ff5b2e',.5)+bar('#f2c94c',.5);
const nowline=`<span style="display:flex;flex-direction:column;align-items:center;flex:none;margin-right:${FS*.14}px"><i style="display:block;width:${FS*.15}px;height:${FS*.15}px;border-radius:50%;background:#ff5b2e"></i><i style="display:block;width:${FS*.045}px;height:${FS*.5}px;background:#ff5b2e"></i></span>`;
const V=[
 ['E','"Now" block: the orange highlight from the schedule, with Sk on it','nowblock',''],
 ['F','Event rules: the colored calendar stripes, then Sk','rules',rules],
 ['G','"Now" line: the current-time marker from calendars, then Sk','line',nowline],
];
const g=document.getElementById('g');
const tab=(tris,kind,fs)=>{
 const sk=kind==='nowblock'?`<span class="sk" style="color:#1a0a04;background:#ff5b2e;padding:${fs*.06}px ${fs*.14}px;border-radius:${fs*.08}px">Sk</span>`:'<span class="sk">Sk</span>';
 return `<div class="tab" data-sk="1" data-kind="${kind}" style="--fs:${fs}px;height:${fs*1.42}px"><div class="inner">${tris}${sk}</div></div>`;};
V.forEach(([id,name,kind,tr])=>{
 const cell=(dark)=>`<div class="cell ${dark?'dk':''}"><div class="lab">${id} \u00b7 ${name}${dark?' \u00b7 on dark':''}</div>
  <div class="row">${tab(tr,kind,FS*1.15)}<div class="word" style="--fs:${FS}px">${tab(tr,kind,FS)}<div class="rest">reen</div></div>
  ${dark?'':`<div style="display:flex;gap:14px;align-items:center"><div class="sm32"></div><small>32px</small></div>`}</div></div>`;
 g.insertAdjacentHTML('beforeend',cell(false)+cell(true));
});
document.fonts.ready.then(()=>{
 document.querySelectorAll('.tab').forEach(t=>{
  const fs=parseFloat(getComputedStyle(t).getPropertyValue('--fs')), inner=t.querySelector('.inner'), w=inner.getBoundingClientRect().width;
  const bez=fs*.104, padL=fs*.2, padR=fs*.07;
  t.style.width=(w+padL+padR+2*bez)+'px'; t.style.paddingRight=(bez+padR)+'px';
 });
 document.querySelectorAll('.sm32').forEach(box=>{
  const src=box.closest('.row').querySelector('.tab'); const c=src.cloneNode(true);
  const k=32/src.getBoundingClientRect().width; c.style.transform=`scale(${k})`; c.style.transformOrigin='0 0';
  box.style.width='32px'; box.style.height=(src.getBoundingClientRect().height*k)+'px'; box.appendChild(c);
 });
 document.body.dataset.ready=1;});
</script>
