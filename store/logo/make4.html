<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(file:///home/user/skreen/site/fonts/bricolage.woff2);font-weight:200 800}
body{margin:0;background:transparent} svg{display:block;margin:0 0 20px}
text{font-family:B,sans-serif;font-weight:800;font-stretch:80%}
</style>
<div id="root"></div>
<script>
const NS='http://www.w3.org/2000/svg';
const pool=(id)=>`<radialGradient id="pool${id}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fffdf8"/><stop offset=".7" stop-color="#fbf1e2"/><stop offset="1" stop-color="#f2d9bd"/></radialGradient>
 <radialGradient id="glow${id}" cx="50%" cy="50%" r="50%"><stop offset=".78" stop-color="#ff5b2e" stop-opacity=".30"/><stop offset="1" stop-color="#ff5b2e" stop-opacity="0"/></radialGradient>`;
// Header wordmark for the light site: no tablet, transparent. The spotlight lights "Sk"; "reen" waits in a quiet warm grey.
const W=1000,H=470,C={x:215,y:235},r=205;
document.getElementById('root').innerHTML=`
<svg id="head" width="1120" height="550" viewBox="-60 -40 1120 550" xmlns="${NS}"><defs>${pool('h')}
 <clipPath id="litc"><circle cx="${C.x}" cy="${C.y}" r="${r}"/></clipPath></defs>
 <circle cx="${C.x}" cy="${C.y}" r="${r*1.2}" fill="url(#glowh)"/>
 <text id="dimt" y="330" font-size="300" fill="#b0a493">Skreen</text>
 <circle cx="${C.x}" cy="${C.y}" r="${r}" fill="url(#poolh)"/>
 <text id="litt" y="330" font-size="300" fill="#ff5b2e" clip-path="url(#litc)">Skreen</text></svg>
<svg id="fav" width="512" height="512" viewBox="0 0 512 512" xmlns="${NS}"><defs>${pool('f')}</defs>
 <circle cx="256" cy="256" r="252" fill="url(#poolf)" stroke="#ecc7a2" stroke-width="3"/>
 <text id="favt" y="332" font-size="300" fill="#ff5b2e">Sk</text></svg>`;
document.fonts.ready.then(()=>{
  const d=document.getElementById('dimt'),l=document.getElementById('litt');
  let fs=300; d.setAttribute('font-size',fs); const w=d.getComputedTextLength(); fs=fs*880/w;
  [d,l].forEach(t=>{t.setAttribute('font-size',fs.toFixed(1));t.setAttribute('x','55');});
  // centre the circle on the "Sk" pair, and the pair vertically on the circle
  const skw=d.getSubStringLength(0,2); const cx=55+skw/2;
  document.querySelectorAll('#head circle').forEach(c=>c.setAttribute('cx',cx.toFixed(1)));
  document.getElementById('litc').firstElementChild.setAttribute('cx',cx.toFixed(1));
  const capH=fs*0.70; const y=H/2+capH/2; [d,l].forEach(t=>t.setAttribute('y',y.toFixed(1)));
  const f=document.getElementById('favt'); const fw=f.getComputedTextLength(); f.setAttribute('x',(256-fw/2).toFixed(1)); f.setAttribute('y',String(256+300*0.35));
  document.body.dataset.ready='1';
});
</script>
